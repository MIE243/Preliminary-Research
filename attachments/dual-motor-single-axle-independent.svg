<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg
  width="1000" height="600" 
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"><defs>
  <g id="ASSEMBLY">
<rect x="-75" y="-50" width="150" height="50" rx="15" stroke="none" fill="black"/>

<rect x="-50" y="0" width="100" height="30" rx="3" stroke="none" fill="green"/>

<rect x="-40" y="55" width="80" height="10" rx="1" stroke="none" fill="#666666"/>
<circle cx="0" cy="60" r="30" fill="white" stroke="#666666" stroke-width="4"/>   </g>
</defs>

<g transform="translate(0,-50)">
<rect x="0" y="0" width="1000" height="600" stroke="none" fill="none"/><rect x="100" y="200" width="800" height="350" rx="15" stroke="#888888" stroke-width="3" fill="lightblue"/><use xlink:href="#ASSEMBLY" transform="translate(250,250)"/>
<use xlink:href="#ASSEMBLY" transform="translate(750,250)"/><use xlink:href="#ASSEMBLY" transform="translate(250,500) scale(1,-1)"/>
<use xlink:href="#ASSEMBLY" transform="translate(750,500) scale(1,-1)"/>
  <g font-size="30px" font-family="sans-serif" font-weight="bold" text-anchor="middle" fill="black"><text font-size="60px" x="500" y="150">Individual wheel drive</text>
<text x="250" y="320">M2</text>
<text x="250" y="450">M1</text>
<text x="750" y="320">M3</text>
<text x="750" y="450">M4</text>

     <g font-size="20px" fill="white">
<text x="250" y="270">Gears</text>
<text x="250" y="495">Gears</text>
<text x="750" y="270">Gears</text>
<text x="750" y="495">Gears</text>
     </g>

  </g></g></svg>