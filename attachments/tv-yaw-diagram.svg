<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b1fa2"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c7fb8"/>
    </marker>
  </defs>
  <rect width="640" height="440" fill="#ffffff"/>
  <text x="320" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Torque vectoring in a left turn (top view, front at top)</text>
  <!-- intended path -->
  <path d="M 250 410 Q 250 150 60 90" fill="none" stroke="#bbb" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="70" y="75" fill="#888" font-size="12">path of the turn</text>
  <!-- body -->
  <rect x="250" y="90" width="140" height="280" rx="30" fill="#eef3f8" stroke="#555" stroke-width="1.5"/>
  <!-- axles -->
  <line x1="238" y1="150" x2="402" y2="150" stroke="#999" stroke-width="3"/>
  <line x1="238" y1="310" x2="402" y2="310" stroke="#999" stroke-width="3"/>
  <!-- wheels (front steered left) -->
  <g fill="#333">
    <rect x="222" y="125" width="24" height="50" rx="4" transform="rotate(-15 234 150)"/>
    <rect x="394" y="125" width="24" height="50" rx="4" transform="rotate(-15 406 150)"/>
    <rect x="222" y="285" width="24" height="50" rx="4"/>
    <rect x="394" y="285" width="24" height="50" rx="4"/>
  </g>
  <!-- drive force arrows on rear wheels -->
  <line x1="234" y1="300" x2="234" y2="255" stroke="#2c7fb8" stroke-width="4" marker-end="url(#ahb)"/>
  <line x1="406" y1="300" x2="406" y2="195" stroke="#c0392b" stroke-width="7" marker-end="url(#ahr)"/>
  <text x="212" y="290" text-anchor="end" fill="#2c7fb8">less torque</text>
  <text x="212" y="306" text-anchor="end" fill="#2c7fb8">(inner wheel)</text>
  <text x="428" y="200" fill="#c0392b" font-weight="bold">more torque</text>
  <text x="428" y="216" fill="#c0392b">(outer wheel)</text>
  <!-- yaw arrow (counter-clockwise, turning left) -->
  <path d="M 360 230 A 45 45 0 1 0 320 275" fill="none" stroke="#7b1fa2" stroke-width="3" marker-end="url(#ahp)"/>
  <text x="320" y="236" text-anchor="middle" fill="#4a148c" font-weight="bold">yaw</text>
  <text x="320" y="252" text-anchor="middle" fill="#4a148c" font-size="11">moment</text>
  <!-- explanation -->
  <g fill="#222" font-size="12">
    <text x="440" y="300">Pushing the outer wheel</text>
    <text x="440" y="316">harder than the inner one</text>
    <text x="440" y="332">twists the car into the turn,</text>
    <text x="440" y="348">which reduces understeer.</text>
  </g>
</svg>
