<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title desc">
  <title id="title">Fully active suspension control loop</title>
  <desc id="desc">A quarter-car diagram showing road, tyre, wheel, spring, active actuator, vehicle body, sensors, controller and power driver.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <style>
      .label{font:700 25px Arial,sans-serif;fill:#0f172a}.small{font:20px Arial,sans-serif;fill:#334155}.box{stroke:#0f172a;stroke-width:3}.wire{fill:none;stroke:#334155;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1100" height="650" fill="#f8fafc"/>
  <text x="550" y="45" text-anchor="middle" class="label" font-size="32">Fully Active Suspension Control Loop</text>

  <path d="M70 570 Q125 515 180 570 T290 570 T400 570 T510 570" fill="none" stroke="#64748b" stroke-width="12"/>
  <text x="90" y="625" class="label">Road input</text>
  <circle cx="330" cy="500" r="63" fill="#1e293b"/>
  <circle cx="330" cy="500" r="32" fill="#94a3b8"/>
  <text x="330" y="590" text-anchor="middle" class="label">Wheel / unsprung mass</text>

  <rect x="130" y="105" width="430" height="90" rx="18" fill="url(#body)" class="box"/>
  <text x="345" y="160" text-anchor="middle" fill="white" font-family="Arial" font-size="27" font-weight="700">Vehicle body / sprung mass</text>

  <path d="M230 200 l-30 35 60 35-60 35 60 35-60 35 30 35" fill="none" stroke="#16a34a" stroke-width="10"/>
  <text x="110" y="305" class="label" fill="#15803d">Spring</text>

  <rect x="365" y="225" width="90" height="180" rx="12" fill="#f97316" class="box"/>
  <path d="M410 195 V225 M410 405 V438" stroke="#0f172a" stroke-width="10"/>
  <path d="M390 315 H430 M410 290 V340" stroke="white" stroke-width="8"/>
  <text x="470" y="305" class="label" fill="#c2410c">Active actuator</text>
  <text x="470" y="336" class="small">adds or removes force</text>

  <rect x="705" y="105" width="280" height="80" rx="12" fill="#dbeafe" class="box"/>
  <text x="845" y="152" text-anchor="middle" class="label">Body &amp; wheel sensors</text>
  <rect x="730" y="265" width="230" height="90" rx="12" fill="#fde68a" class="box"/>
  <text x="845" y="320" text-anchor="middle" class="label">Control ECU</text>
  <rect x="705" y="435" width="280" height="90" rx="12" fill="#fed7aa" class="box"/>
  <text x="845" y="475" text-anchor="middle" class="label">Power driver</text>
  <text x="845" y="505" text-anchor="middle" class="small">48 V pump or motor</text>

  <path class="wire" d="M560 145 H705"/>
  <path class="wire" d="M845 185 V265"/>
  <path class="wire" d="M845 355 V435"/>
  <path class="wire" d="M705 480 H565 Q520 480 455 365"/>
  <path class="wire" d="M705 145 C640 145 650 500 400 500"/>
  <text x="620" y="247" class="small">motion feedback</text>
  <text x="575" y="455" class="small">commanded force</text>
</svg>
